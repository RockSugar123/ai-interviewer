# RocketMQ Broker 配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 中间件跑在虚拟机、应用跑在 Windows 宿主机时：
# 改成虚拟机的 IP（如 192.168.x.x），否则宿主机拿到容器内地址连不上（阶段 5 接入前必须改）
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
