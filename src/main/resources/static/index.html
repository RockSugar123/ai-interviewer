<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 模拟面试官</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f5f7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1f2937; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  header .user { font-size: 14px; color: #cbd5e1; }
  header button, .panel button { cursor: pointer; }
  main { flex: 1; display: flex; overflow: hidden; }
  .panel { width: 300px; background: #fff; border-right: 1px solid #e5e7eb; padding: 14px; overflow-y: auto; }
  .panel h3 { font-size: 14px; color: #374151; margin: 12px 0 6px; }
  .panel input, .panel textarea { width: 100%; margin: 3px 0 8px; padding: 7px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .panel textarea { height: 70px; resize: vertical; }
  .panel button { padding: 7px 12px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 13px; margin-right: 6px; }
  .panel button.gray { background: #6b7280; }
  .panel button.red { background: #dc2626; }
  .session-item { padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .session-item:hover { background: #eff6ff; }
  .session-item.active { background: #dbeafe; border-color: #2563eb; }
  .session-item .meta { color: #6b7280; font-size: 11px; margin-top: 2px; }
  .chat { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 72%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .bubble.assistant { background: #fff; border: 1px solid #e5e7eb; align-self: flex-start; border-top-left-radius: 2px; }
  .bubble.user { background: #2563eb; color: #fff; align-self: flex-end; border-top-right-radius: 2px; }
  .bubble .seq { display: block; font-size: 10px; opacity: .55; margin-top: 4px; }
  .thinking { color: #6b7280; font-size: 13px; align-self: flex-start; padding: 6px 10px; font-style: italic; }
  .composer { padding: 14px; background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
  .composer textarea { flex: 1; height: 64px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; resize: none; }
  .composer button { width: 92px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  .composer button:disabled { background: #93c5fd; cursor: not-allowed; }
  .empty { margin: auto; color: #9ca3af; font-size: 15px; }
  #toast { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 8px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 99; }
</style>
</head>
<body>
<header>
  <div style="font-weight:bold">AI 模拟面试官 <span style="font-size:11px;color:#9ca3af">联调版 v0.2</span></div>
  <div class="user" id="userBox"></div>
</header>

<div id="authPanel" style="display:none;width:340px;margin:60px auto;" class="panel">
  <h3>登录 / 注册（首次请先注册）</h3>
  <input id="authUser" placeholder="用户名（4-32位字母数字下划线）">
  <input id="authPass" type="password" placeholder="密码（至少6位）">
  <button onclick="login()">登录</button>
  <button class="gray" onclick="register()">注册</button>
</div>

<main id="appMain" style="display:none">
  <div class="panel">
    <h3>新建面试会话</h3>
    <input id="newTitle" placeholder="会话标题（可选）">
    <textarea id="newJd" placeholder="粘贴目标 JD（可选，Agent 出题会更精准）"></textarea>
    <button onclick="createSession()">创建会话</button>
    <h3>我的会话</h3>
    <button class="gray" onclick="loadSessions()" style="margin-bottom:8px">刷新</button>
    <div id="sessionList"></div>
  </div>
  <div class="chat">
    <div class="messages" id="messages"><div class="empty">选择左侧会话开始模拟面试</div></div>
    <div class="composer">
      <textarea id="inputBox" placeholder="输入你的回答…（Enter 发送，Shift+Enter 换行）" disabled></textarea>
      <button id="sendBtn" onclick="send()" disabled>发送</button>
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem('token');
const currentSid = () => localStorage.getItem('sid');

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.style.background = err ? '#dc2626' : '#111827';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2600);
}

async function api(path, method = 'GET', body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token()) headers['Authorization'] = 'Bearer ' + token();
  const resp = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data;
  try { data = await resp.json(); } catch { throw new Error('HTTP ' + resp.status); }
  if (data.code !== 0) throw new Error(data.message || ('错误码 ' + data.code));
  return data.data;
}

// ---------- 认证 ----------
function renderAuth() {
  if (token()) {
    $('authPanel').style.display = 'none';
    $('appMain').style.display = 'flex';
    api('/api/auth/me').then(u => { $('userBox').textContent = u.username + '，欢迎回来'; })
      .catch(() => { logout(); return; });
    loadSessions();
  } else {
    $('authPanel').style.display = 'block';
    $('appMain').style.display = 'none';
    $('userBox').textContent = '未登录';
  }
}
async function register() {
  try {
    await api('/api/auth/register', 'POST', { username: $('authUser').value.trim(), password: $('authPass').value });
    toast('注册成功，请登录');
  } catch (e) { toast(e.message, true); }
}
async function login() {
  try {
    const data = await api('/api/auth/login', 'POST', { username: $('authUser').value.trim(), password: $('authPass').value });
    localStorage.setItem('token', data.token);
    renderAuth();
  } catch (e) { toast(e.message, true); }
}
function logout() { localStorage.removeItem('token'); localStorage.removeItem('sid'); renderAuth(); }

// ---------- 会话 ----------
async function createSession() {
  try {
    const s = await api('/api/sessions', 'POST', { title: $('newTitle').value.trim(), jdText: $('newJd').value });
    toast('会话已创建');
    $('newTitle').value = ''; $('newJd').value = '';
    await loadSessions();
    selectSession(s.id);
  } catch (e) { toast(e.message, true); }
}
async function loadSessions() {
  try {
    const page = await api('/api/sessions?page=1&size=50');
    const box = $('sessionList');
    box.innerHTML = '';
    page.list.forEach(s => {
      const div = document.createElement('div');
      div.className = 'session-item' + (String(s.id) === currentSid() ? ' active' : '');
      div.innerHTML = `<b>#${s.id}</b> ${esc(s.title)}
        <div class="meta">${s.status} · 状态机 ${s.agentState || '未开始'} · 提问 ${s.questionCount || 0} 题</div>`;
      div.onclick = () => selectSession(s.id);
      box.appendChild(div);
    });
  } catch (e) { toast(e.message, true); }
}
async function selectSession(id) {
  localStorage.setItem('sid', id);
  $('inputBox').disabled = false;
  $('sendBtn').disabled = false;
  await Promise.all([loadSessions(), loadMessages(), loadSessionDetail()]);
}
async function loadSessionDetail() {
  if (!currentSid()) return;
  try {
    const s = await api('/api/sessions/' + currentSid());
    $('sendBtn').textContent = s.status === 'FINISHED' ? '已结束' : '发送';
    $('sendBtn').disabled = s.status === 'FINISHED';
    $('inputBox').disabled = s.status === 'FINISHED';
  } catch (e) { toast(e.message, true); }
}
async function finishSession() {
  if (!currentSid()) return toast('请先选择会话', true);
  try {
    await api('/api/sessions/' + currentSid() + '/finish', 'POST');
    toast('面试已结束');
    await Promise.all([loadSessions(), loadSessionDetail()]);
  } catch (e) { toast(e.message, true); }
}

// ---------- 消息 ----------
async function loadMessages() {
  if (!currentSid()) return;
  try {
    const list = await api('/api/sessions/' + currentSid() + '/messages');
    const box = $('messages');
    box.innerHTML = '';
    if (!list.length) box.innerHTML = '<div class="empty">发送你的开场自我介绍，面试官将开始提问</div>';
    list.forEach(m => box.appendChild(bubble(m)));
    box.scrollTop = box.scrollHeight;
  } catch (e) { toast(e.message, true); }
}
function bubble(m) {
  const div = document.createElement('div');
  div.className = 'bubble ' + (m.role === 'ASSISTANT' ? 'assistant' : 'user');
  div.textContent = m.content;
  const seq = document.createElement('span');
  seq.className = 'seq';
  seq.textContent = (m.role === 'ASSISTANT' ? '面试官' : '我') + ' · seq ' + m.seq + ' · ' + m.tokenCount + ' tokens';
  div.appendChild(seq);
  return div;
}
async function send() {
  const content = $('inputBox').value.trim();
  if (!content || !currentSid()) return;
  $('inputBox').value = '';
  $('sendBtn').disabled = true;
  const box = $('messages');
  const pending = document.createElement('div');
  pending.className = 'thinking';
  pending.textContent = '面试官思考中…（qwen3.7-plus 思维链较慢，约 10-40 秒）';
  box.appendChild(pending);
  box.scrollTop = box.scrollHeight;
  try {
    await api('/api/sessions/' + currentSid() + '/messages', 'POST', { content });
    await Promise.all([loadMessages(), loadSessionDetail(), loadSessions()]);
  } catch (e) {
    pending.remove();
    toast(e.message, true);
    await loadMessages();
  } finally {
    $('sendBtn').disabled = false;
    loadSessionDetail();
  }
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

$('inputBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
renderAuth();
</script>
</body>
</html>
