# 中间件编排（W8 交付目标：一键起全部中间件）
# 本机开发时 Docker 跑在虚拟机上：
#   1) 虚拟机内：docker compose up -d（可选择性只起 redis / rocketmq / prometheus / grafana）
#   2) Windows 宿主机应用通过 VM IP 连接：.env 里把 REDIS_HOST / MYSQL_HOST 改成虚拟机 IP
services:
  mysql:
    image: mysql:8.0
    container_name: ai-interviewer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_interviewer}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis/redis-stack:latest   # 带 RediSearch，W4 向量检索复用；版本定型后再固定 tag
    container_name: ai-interviewer-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
      - "8001:8001"                   # RedisInsight 管理界面
    volumes:
      - redis-data:/data

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: ai-interviewer-mq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: ai-interviewer-mq-broker
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    ports:
      - "10911:10911"
      - "10909:10909"

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-interviewer-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux VM 下让容器能解析网关域名
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: ai-interviewer-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  redis-data:
  grafana-data:
