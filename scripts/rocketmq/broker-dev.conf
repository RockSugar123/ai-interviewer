# RocketMQ 本机开发 broker 配置（阶段 5；容器版配置见 docker/rocketmq/broker.conf）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = 127.0.0.1:9876
# 本机直连无 NAT，显式回环地址避免多网卡下客户端拿到不可达地址
brokerIP1 = 127.0.0.1
# 开发期自动建 Topic，免得每次 mqadmin 手工建
autoCreateTopicEnable = true
# 消息保留 12 小时（默认 48h），省磁盘
deleteWhen = 04
fileReservedTime = 12
diskMaxUsedSpaceRatio = 90
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 存储路径显式指定（默认落在用户目录，不集中不好清理）
# 注意：properties 格式里 \r 会被当转义符吃掉（F:\rocketmq → F:ocketmq），必须用正斜杠
storePathRootDir = F:/rocketmq/store
storePathCommitLog = F:/rocketmq/store/commitlog
